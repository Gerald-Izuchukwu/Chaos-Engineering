services:

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports: 
    - 8080:8080
    volumes:
    - ./nginx/nginx.conf.main:/etc/nginx/nginx.conf:ro #ro is readonly, ie nginx cant modify it
    - nginx_logs:/var/log/nginx #mounting the shared volume shared volume for logs
    depends_on:
    - app_blue
    - app_green

  watcher:
    image: alert-watcher:3.0
    container_name: alert_watcher_service
    volumes:
      - nginx_logs:/var/log/nginx:ro
    environment:
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      ERROR_RATE_THRESHOLD: ${ERROR_RATE_THRESHOLD}
      WINDOW_SIZE: ${WINDOW_SIZE}
      ALERT_COOLDOWN: ${ALERT_COOLDOWN}
    depends_on:
    - nginx

  app_blue:
    image: chaos:2.0
    container_name: blue_depl
    environment:
      PORT: 8081
      POOL_NAME: blue
      RELEASE_ID: ${RELEASE_ID_BLUE}
    ports:
    - 8081:8081
  app_green:
    image: chaos:2.0
    container_name: green_depl
    environment:
      PORT: 8082
      POOL_NAME: green
      RELEASE_ID: ${RELEASE_ID_GREEN}
    ports:
    - 8082:8082

volumes:
  nginx_logs: #shared volume file, where nginx and python watcher can read